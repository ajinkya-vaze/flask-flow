<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flask Flow</title>
<meta name="description" content="A calm liquid-sort puzzle. No ads, ever.">
<meta name="theme-color" content="#141a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flask Flow">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 14h9"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  </defs>
</svg>

<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="home-inner">
      <div class="logo">
        <h1>Flask Flow</h1>
        <p>Sort the colors. No ads, ever.</p>
      </div>
      <div class="hero" id="hero" aria-hidden="true"></div>
      <button class="btn primary play" id="play-btn">
        <span id="play-label">Play</span>
        <small id="play-sub">Level 1</small>
      </button>
      <button class="daily-card" id="daily-card">
        <div class="daily-icon">☀︎</div>
        <div class="daily-text">
          <strong>Daily Puzzle · <span id="daily-date"></span></strong>
          <span id="daily-streak"></span>
        </div>
        <div class="daily-status" id="daily-status">Play</div>
      </button>
      <div class="home-row">
        <button class="btn" id="levels-btn"><svg class="ic"><use href="#i-grid"/></svg>Levels</button>
        <button class="btn" id="home-settings"><svg class="ic"><use href="#i-gear"/></svg>Settings</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="back-btn" aria-label="Home"><svg><use href="#i-back"/></svg></button>
      <div class="title">
        <h2 id="game-title">Level 1</h2>
        <small id="game-sub">Moves 0</small>
      </div>
      <button class="icon-btn" id="restart-btn" aria-label="Restart"><svg><use href="#i-restart"/></svg></button>
      <button class="icon-btn" id="game-settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </header>
    <p class="tip" id="tip"></p>
    <div id="board"></div>
    <div id="stuck" class="stuck">
      <span>No moves left</span>
      <button class="btn small" data-act="undo">Undo</button>
      <button class="btn small" data-act="flask" id="stuck-flask">+ Flask</button>
      <button class="btn small primary" data-act="restart">Restart</button>
    </div>
    <footer class="toolbar">
      <button class="tool" id="undo-btn"><span class="ic"><svg><use href="#i-undo"/></svg></span>Undo</button>
      <button class="tool" id="hint-btn"><span class="ic"><svg><use href="#i-bulb"/></svg></span>Hint</button>
      <button class="tool" id="flask-btn"><span class="ic"><svg><use href="#i-flask"/></svg><span class="badge" id="flask-badge">1</span></span>Flask</button>
    </footer>
  </section>

  <!-- LEVELS -->
  <section id="levels" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="levels-back" aria-label="Home"><svg><use href="#i-back"/></svg></button>
      <div class="title"><h2>Levels</h2><small id="levels-sub"></small></div>
      <span class="icon-spacer"></span>
    </header>
    <div class="level-grid" id="level-grid"></div>
  </section>
</div>

<div id="toast" role="status"></div>
<div id="modal"><div class="modal-card" id="modal-card"></div></div>
<div id="fx" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
